<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi corazon</title>
    <script src="js/musica.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; 
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        #container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0; animation: twinkle var(--duration) infinite ease-in-out; animation-delay: var(--delay); }
        .progress-container { position: absolute; bottom: 50px; width: 300px; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; left: 50%; transform: translateX(-50%); overflow: hidden; z-index: 25; opacity: 0.7; }
        .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, #ff2a6d, #d40078); border-radius: 4px; transition: width 0.3s ease-out; }
        .i-love-you-meteor { position: absolute; font-size: 1.8rem; font-weight: bold; color: #ff2a6d; text-shadow: 0 0 10px rgba(255, 42, 109, 0.8); z-index: 15; pointer-events: none; opacity: 0; font-family: 'Arial Black', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .impact-effect { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(255,42,109,0.8) 0%, rgba(255,42,109,0) 70%); pointer-events: none; z-index: 10; opacity: 0; }
        .completion-message { position: absolute; top: 20px; width: 100%; text-align: center; color: #ff2a6d; font-size: 1.5rem; z-index: 30; opacity: 0; transform: translateY(-20px); transition: all 1s ease; text-shadow: 0 0 10px rgba(255, 42, 109, 0.8); font-family: 'Arial Black', sans-serif; letter-spacing: 2px; }
        .title { position: absolute; top: 20px; width: 100%; text-align: center; color: #ff2a6d; font-size: 3.5rem; z-index: 30; text-shadow: 0 0 15px rgba(255, 42, 109, 0.8); font-family: 'Arial Black', sans-serif; letter-spacing: 3px; animation: pulseText 3s infinite; text-transform: uppercase; }
        .instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #ffb6c1; font-size: 1.2rem; z-index: 30; opacity: 0.7; }
        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        @keyframes pulseText { 0%, 100% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 42, 109, 0.8); } 50% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 42, 109, 1); } }
        @keyframes meteorFall { 0% { transform: translateY(-100px) rotate(0deg) scale(0.5); opacity: 0.8; } 80% { opacity: 1; text-shadow: 0 0 20px rgba(255, 42, 109, 1); } 100% { transform: translateY(100vh) rotate(10deg) scale(1.2); opacity: 0; } }
        @keyframes impact { 0% { transform: scale(0); opacity: 0.8; } 50% { opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .floating-hearts { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .floating-heart { position: absolute; font-size: 1.2rem; opacity: 0.5; animation: floatHeart linear infinite; }
        @keyframes floatHeart { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 20% { opacity: 0.7; } 100% { transform: translateY(-100px) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="container"></div>
    <div class="stars" id="stars"></div>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="completion-message" id="completionMessage">¡Corazón formado!</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="instructions">Las partículas se están uniendo...</div>

    <script>
        let scene, camera, renderer, heartParticles;
        let animationPhase = 0; 
        let formationProgress = 0;
        let progressBar = document.getElementById('progressBar');
        let lastMeteorTime = 0;
        let meteorInterval = 300;
        let completionMessage = document.getElementById('completionMessage');
        let instructions = document.querySelector('.instructions');
        let floatingHearts = document.getElementById('floatingHearts');

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 800; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${Math.random() * 5 + 3}s`);
                star.style.setProperty('--delay', `${Math.random() * 5}s`);
                starsContainer.appendChild(star);
            }
        }
        
        function createFloatingHearts() {
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.bottom = `-50px`;
                heart.style.color = `hsl(${330 + Math.random() * 20}, 100%, 70%)`;
                heart.style.fontSize = `${0.8 + Math.random() * 1.5}rem`;
                heart.style.animation = `floatHeart ${10 + Math.random() * 20}s linear infinite`;
                heart.style.animationDelay = `${Math.random() * 15}s`;
                floatingHearts.appendChild(heart);
            }
        }

        function createLoveMeteor() {
            const meteor = document.createElement('div');
            meteor.classList.add('i-love-you-meteor');
            meteor.textContent = "I LOVE YOU";
            const startX = Math.random() * window.innerWidth;
            meteor.style.left = `${startX}px`;
            meteor.style.top = `-50px`;
            meteor.style.animation = `meteorFall ${1 + Math.random() * 2}s linear forwards`;
            document.body.appendChild(meteor);
            setTimeout(() => {
                const impact = document.createElement('div');
                impact.classList.add('impact-effect');
                impact.style.left = `${startX}px`;
                impact.style.bottom = `20px`;
                impact.style.animation = `impact 0.8s ease-out forwards`;
                document.body.appendChild(impact);
                setTimeout(() => impact.remove(), 800);
            }, 800);
            setTimeout(() => meteor.remove(), 3000);
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            const particleCount = 6000;
            const positions = new Float32Array(particleCount * 3);
            const targetPositions = new Float32Array(particleCount * 3);
            const startPositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const t = (i / particleCount) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                targetPositions[i3] = x * 1.2; targetPositions[i3+1] = y * 1.2; targetPositions[i3+2] = (Math.random()-0.5)*4;
                startPositions[i3] = (Math.random()-0.5)*150; startPositions[i3+1] = (Math.random()-0.5)*150; startPositions[i3+2] = (Math.random()-0.5)*150;
                positions[i3] = startPositions[i3]; positions[i3+1] = startPositions[i3+1]; positions[i3+2] = startPositions[i3+2];
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            heartParticles = new THREE.Points(geo, new THREE.PointsMaterial({size: 0.3, color: 0xff2a6d, transparent: true, blending: THREE.AdditiveBlending}));
            heartParticles.geometry.targetPositions = targetPositions;
            heartParticles.geometry.startPositions = startPositions;
            scene.add(heartParticles);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (Date.now() - lastMeteorTime > meteorInterval) { createLoveMeteor(); lastMeteorTime = Date.now(); }
            
            if (animationPhase === 0) {
                formationProgress = Math.min(1, formationProgress + 0.003);
                progressBar.style.width = `${formationProgress * 100}%`;
                const pos = heartParticles.geometry.attributes.position.array;
                const start = heartParticles.geometry.startPositions;
                const target = heartParticles.geometry.targetPositions;
                for (let i = 0; i < pos.length; i++) pos[i] = start[i] + (target[i] - start[i]) * formationProgress;
                heartParticles.geometry.attributes.position.needsUpdate = true;
                if (formationProgress >= 1) {
                    animationPhase = 1;
                    completionMessage.style.opacity = "1";
                    instructions.textContent = "Te amo ❤️";
                    setTimeout(() => document.querySelector('.progress-container').style.opacity = "0", 1000);
                }
            } else {
                heartParticles.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            createFloatingHearts();
            initThreeJS();
        });
    </script>
</body>
</html>
