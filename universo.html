<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un universo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/universo.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="stage" class="welcome">
  <div class="vis" id="vis">
    <div class="planet" aria-hidden="false"><div class="bob"><div class="globe"></div><div class="fws" id="fws"></div></div></div>
  </div>
  <div class="copy" id="copy" aria-live="polite"></div>
  <div class="ctl"><button id="btn" type="button">Descubrir</button></div>
</main>
<div class="photo" id="photo" tabindex="-1" hidden role="dialog" aria-modal="true" aria-label="Foto">
  <figure class="polaroid"><img alt="Foto de Deyanira" hidden><div class="fb" hidden>💜<small></small></div><figcaption></figcaption></figure>
  <p class="x">Toca para cerrar</p>
</div>
<script src="js/musica.js"></script>
<script src="js/universo.js"></script>
</body>
</html>
